<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>OA 文件智能归档</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'; img-src data:">
<style>
  :root { color-scheme: light dark; --bg:#f6f7fb; --fg:#1b1f2a; --muted:#5c6475; --track:#dfe3ee; --pri:#2757d4; --pri2:#5b8cff; --bd:#d8dce6; --err:#c4352b; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161a23; --fg:#e8eaf0; --muted:#9aa3b5; --track:#2a3141; --pri:#6f98ff; --pri2:#9db8ff; --bd:#2c3342; --err:#ff8a80; } }
  html,body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--fg); font:14px/1.5 "Segoe UI","Microsoft YaHei UI",sans-serif; -webkit-user-select:none; user-select:none; }
  body { border:1px solid var(--bd); box-sizing:border-box; display:flex; flex-direction:column; align-items:center; justify-content:center; -webkit-app-region:drag; }
  .logo { width:84px; height:84px; position:relative; }
  .logo svg { width:84px; height:84px; display:block; }
  .ring { position:absolute; inset:-16px; border-radius:50%; border:3px solid transparent; border-top-color:var(--pri2); border-right-color:var(--pri); animation:spin 1.1s linear infinite; will-change:transform; }
  .err .ring { animation:none; border-color:var(--err); }
  h1 { font-size:20px; margin:20px 0 0; font-weight:600; letter-spacing:.5px; }
  .ver { color:var(--muted); font-size:12px; margin-top:2px; }
  .bar { width:300px; height:6px; border-radius:3px; background:var(--track); margin-top:24px; overflow:hidden; position:relative; }
  .fill { position:absolute; left:0; top:0; bottom:0; width:0; border-radius:3px; background:linear-gradient(90deg,var(--pri),var(--pri2)); transition:width .5s cubic-bezier(.3,.7,.2,1); overflow:hidden; }
  .fill::after { content:""; position:absolute; inset:0; background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent); transform:translateX(-100%); animation:shine 1.6s ease-in-out infinite; will-change:transform; }
  .indet .fill { width:35% !important; transition:none; animation:slide 1.4s ease-in-out infinite; will-change:transform; }
  .status { margin-top:12px; font-size:13px; min-height:20px; }
  .hint { color:var(--muted); font-size:12px; min-height:18px; margin-top:2px; text-align:center; padding:0 28px; }
  #errbox { display:none; width:420px; text-align:center; -webkit-app-region:no-drag; }
  .err #errbox { display:block; } .err .bar, .err .status, .err .hint { display:none; }
  #errbox h2 { margin:18px 0 4px; font-size:16px; color:var(--err); }
  #errbox p { margin:0; color:var(--muted); font-size:12px; }
  .row { display:flex; gap:8px; justify-content:center; margin-top:14px; }
  button { font:inherit; padding:6px 16px; border-radius:999px; border:1px solid var(--bd); background:transparent; color:var(--fg); cursor:pointer; }
  button.pri { background:var(--pri); border-color:var(--pri); color:#fff; } button:focus-visible { outline:2px solid var(--pri2); outline-offset:2px; }
  @keyframes spin { to { transform:rotate(360deg); } }
  @keyframes shine { to { transform:translateX(100%); } }
  @keyframes slide { 0% { transform:translateX(-100%); } 100% { transform:translateX(290%); } }
  @media (prefers-reduced-motion: reduce) { .ring, .fill::after, .indet .fill { animation:none; } .fill { transition:none; } .indet .fill { width:100% !important; opacity:.5; } .ring { border-top-color:var(--pri2); border-right-color:var(--pri2); border-bottom-color:var(--pri2); border-left-color:var(--pri2); opacity:.45; } }
</style>
</head>
<body>
  <div class="logo"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">  <defs>    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b7bff"/><stop offset="1" stop-color="#1e4bc4"/></linearGradient>  </defs>  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#g)"/>  <path d="M82 52h66l38 38v104a12 12 0 0 1-12 12H82a12 12 0 0 1-12-12V64a12 12 0 0 1 12-12z" fill="#fff"/>  <path d="M148 52v38h38z" fill="#bcd0ff"/>  <rect x="90" y="108" width="68" height="8" rx="4" fill="#9db6f5"/>  <rect x="90" y="128" width="52" height="8" rx="4" fill="#9db6f5"/>  <circle cx="160" cy="176" r="30" fill="#22b573"/>  <path d="M146 176l10 10 19-20" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></svg><div class="ring"></div></div>
  <h1>OA 文件智能归档</h1>
  <div class="ver" id="ver"></div>
  <div class="bar" id="bar"><div class="fill" id="fill"></div></div>
  <div class="status" id="status">正在启动…</div>
  <div class="hint" id="hint"></div>
  <div id="errbox">
    <h2 id="etitle"></h2><p id="ehint"></p>
    <div class="row"><button class="pri" data-a="retry">重试</button><button data-a="logs">查看日志</button><button data-a="data">数据文件夹</button><button data-a="quit">退出</button></div>
  </div>
  <script src="splash.js"></script>
</body>
</html>
