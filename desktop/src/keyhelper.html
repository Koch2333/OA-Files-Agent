<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>密钥窗口</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'">
<style>
  :root { color-scheme: light dark; --bg:#fdf8ff; --fg:#1d1a22; --muted:#5f5b69; --card:#f3edf7; --pri:#6750a4; --on-pri:#fff; --bd:#cac4d0; --err:#b3261e; --warn:#8a5100; --ok:#1c7c4d; --sec:#e8def8; --on-sec:#1d192b; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141218; --fg:#e6e0e9; --muted:#cac4d0; --card:#211f26; --pri:#d0bcff; --on-pri:#381e72; --bd:#49454f; --err:#f2b8b5; --warn:#ffb870; --ok:#6fd6a0; --sec:#4a4458; --on-sec:#e8def8; } }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:14px/1.55 "Segoe UI","Microsoft YaHei UI",sans-serif; overflow:hidden; }
  .panel { display:flex; flex-direction:column; height:100%; border-left:1px solid var(--bd); box-sizing:border-box; }
  header { display:flex; align-items:center; gap:6px; padding:10px 10px 8px 14px; }
  header h1 { flex:1; margin:0; font-size:15px; font-weight:600; min-width:0; }
  .urlbar { display:flex; align-items:center; gap:6px; margin:0 12px 6px; padding:6px 10px; border-radius:12px; background:var(--card); min-width:0; }
  .urlbar .t { min-width:0; flex:1; line-height:1.25; } .urlbar .host { font-weight:600; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .urlbar .path { font-size:11px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .scroll { flex:1; overflow:auto; padding:4px 12px 8px; }
  ol { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; }
  li { display:flex; gap:10px; padding:8px 10px; border-radius:14px; color:var(--muted); }
  li .n { flex:none; width:22px; height:22px; border-radius:50%; display:grid; place-items:center; font-size:12px; font-weight:600; background:var(--card); color:var(--muted); margin-top:1px; }
  li .st { font-weight:600; } li .body { min-width:0; flex:1; }
  li.cur { background:var(--sec); color:var(--on-sec); } li.cur .n { background:var(--pri); color:var(--on-pri); }
  li.done .n { background:var(--ok); color:#fff; } li.done .st { text-decoration:none; }
  .hint { margin-top:4px; } .row { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
  .warnbox { margin-top:8px; padding:6px 10px; border-radius:10px; background:color-mix(in srgb, var(--warn) 16%, transparent); color:var(--warn); font-size:13px; }
  button { font:inherit; padding:6px 14px; border-radius:999px; border:1px solid var(--bd); background:transparent; color:var(--fg); cursor:pointer; }
  button:hover:not(:disabled) { background:color-mix(in srgb, var(--pri) 10%, transparent); }
  button.pri { background:var(--pri); border-color:var(--pri); color:var(--on-pri); } button:disabled { opacity:.4; cursor:default; }
  button.ic { padding:2px 9px; font-size:15px; line-height:1.3; }
  button:focus-visible, input:focus-visible { outline:3px solid var(--pri); outline-offset:2px; }
  .card { margin:8px 0; padding:12px; border-radius:16px; background:var(--card); }
  .detected { border:2px solid var(--ok); } .detected b { font-family:Consolas,"Cascadia Mono",monospace; }
  .wait { color:var(--muted); font-size:13px; padding:4px 10px; }
  .banner { margin:6px 0; padding:8px 12px; border-radius:12px; font-size:13px; } .banner.w { background:color-mix(in srgb, var(--err) 14%, transparent); color:var(--err); }
  .banner.i { background:var(--card); }
  label { display:block; font-size:12px; color:var(--muted); margin-bottom:4px; }
  input[type=text] { width:100%; box-sizing:border-box; padding:7px 10px; border-radius:10px; border:1px solid var(--bd); background:var(--bg); color:var(--fg); font:inherit; }
  details { font-size:13px; color:var(--muted); margin:6px 2px; } summary { cursor:pointer; } details p { margin:6px 0; }
  footer { border-top:1px solid var(--bd); padding:8px 12px 10px; display:flex; flex-direction:column; gap:6px; }
  footer button { padding:4px 12px; font-size:13px; } footer .row { margin:0; gap:6px; } footer small { color:var(--muted); font-size:11.5px; line-height:1.4; }
  .chip { font-size:11px; padding:1px 8px; border-radius:999px; background:color-mix(in srgb, var(--warn) 18%, transparent); color:var(--warn); }
  .spin { font-size:12px; color:var(--muted); }
  .manage { max-width:560px; margin:0 auto; padding:8px 4px 16px; }
  .manage h2 { font-size:20px; font-weight:500; margin:8px 0 12px; }
  .kv { display:grid; grid-template-columns:110px 1fr; gap:6px 12px; margin:0; } .kv dt { color:var(--muted); } .kv dd { margin:0; word-break:break-all; }
  .mono { font-family:Consolas,"Cascadia Mono",monospace; }
  .ok { color:var(--ok); } .bad { color:var(--err); }
  .confirm { background:color-mix(in srgb, var(--err) 12%, transparent); border-radius:14px; padding:10px 14px; margin-top:12px; }
  body.manage-view .urlbar, body.manage-view #toggle, body.manage-view footer .sysrow, body.manage-view .guideonly { display:none; }
  body.collapsed .scroll, body.collapsed footer, body.collapsed .urlbar, body.collapsed h1 { display:none; }
  body.collapsed header { padding:10px 6px; justify-content:center; }
</style>
</head>
<body>
<div class="panel">
  <header>
    <h1 id="title">密钥向导</h1>
    <span class="chip" id="test" hidden>测试模式</span>
    <button class="ic" id="toggle" aria-label="收起指引" title="收起/展开指引">›</button>
  </header>
  <div class="urlbar" role="status" aria-label="当前网页">
    <span id="lock" aria-hidden="true">🔒</span>
    <div class="t"><div class="host" id="host">…</div><div class="path" id="path"></div></div>
    <span class="spin" id="loading" hidden>加载中…</span>
    <button class="ic" id="back" aria-label="后退" title="后退" disabled>←</button>
    <button class="ic" id="reload" aria-label="刷新" title="回到密钥页面并刷新">⟳</button>
  </div>
  <div class="scroll">
    <section class="manage" id="manage" aria-labelledby="mtitle" hidden></section>
    <div id="guideBox">
    <div class="banner w" id="warn" role="alert" hidden></div>
    <div class="banner i" id="notice" role="status" hidden></div>
    <ol id="steps" aria-label="操作步骤"></ol>
    <div class="wait" id="waiting" role="status" hidden>正在等你复制密钥……复制好后，这里会自动识别。</div>
    <div class="card detected" id="detected" role="status" hidden>
      <div>识别到一把密钥，尾号 <b id="masked"></b></div>
      <div style="margin:8px 0 4px"><label for="label">你给它起的名字（可改，仅用于在设置里显示）</label><input type="text" id="label" maxlength="80" autocomplete="off" spellcheck="false"></div>
      <div class="row"><button class="pri" id="use">使用这个密钥</button><button id="ignore">忽略</button></div>
      <small style="color:var(--muted)">确认后会把密钥填进设置并自动测试连接；剪贴板里如果还是这把密钥，会被清空。</small>
    </div>
    <div class="card detected" id="callback" role="status" hidden><b>授权已提交。</b>正在回到设置页面完成连接，这个窗口会自动关闭。</div>
    <details id="notes"><summary>登录和费用提示</summary><p id="loginNote"></p><p id="costNote"></p></details>
    </div>
  </div>
  <footer>
    <div class="row"><span class="sysrow"><button id="sys">改用系统浏览器</button> <button id="clear">退出登录并清除本窗口数据</button></span><button id="cancel">关闭窗口</button></div>
    <small>本窗口不会读取网页内容、账号或密码，也不会替你点击；只在你复制之后检查剪贴板里是不是一把密钥，你确认后才会使用。</small>
  </footer>
</div>
<script src="keyhelper.js"></script>
</body>
</html>
