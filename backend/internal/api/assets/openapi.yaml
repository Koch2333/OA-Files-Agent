openapi: 3.1.0
info:
  title: OA Agent API
  version: 1.0.0
  description: |
    企业 OA 文件智能归档智能体后端接口（唯一编辑源：本文件；运行 `python scripts/sync_contract.py` 同步 Go 内嵌副本）。
    成功响应统一包裹为 `{"data": ...}`；列表为 `{"data": {"items", "total", "page", "page_size"}}`；错误为 `{"error": {code, message, request_id, details?}}`。
    审批与执行是两个独立步骤；执行必须带 `Idempotency-Key`。认证：`enterprise` 模式需登录（Cookie 会话 + CSRF，见 docs/auth-design.md），`local` 模式为本机单用户免登录；未初始化时除 /v1/setup/*、/healthz、/readyz 外返回 503 `SETUP_REQUIRED`；未登录 401 `UNAUTHENTICATED`；角色不足 403 `FORBIDDEN`；CSRF 失败 403 `CSRF_INVALID`。
    跨站的写请求（Origin/Sec-Fetch-Site 不是同源）返回 403 `CROSS_ORIGIN`；服务仅监听本机时，Host 不是 localhost/127.0.0.1/::1 的请求返回 403 `HOST_NOT_ALLOWED`（防 DNS 重绑定）。
security:
  - cookieAuth: []
servers:
  - url: http://127.0.0.1:8080
x-global-errors:
  description: 任何路由都可能返回的横切错误（浏览器安全防护），体裁同 Error。
  "401": [UNAUTHENTICATED]
  "403": [CROSS_ORIGIN, HOST_NOT_ALLOWED, FORBIDDEN, CSRF_INVALID]
  "409": [WIZARD_REQUIRED]
  "503": [SETUP_REQUIRED]
tags:
  - {name: system}
  - {name: imports}
  - {name: files}
  - {name: plans}
  - {name: ledger}
  - {name: templates}
  - {name: admin}
  - {name: fs}
  - {name: storage}
  - {name: setup}
  - {name: auth}
  - {name: admin-users}
  - {name: ai}
  - {name: diagnostics}
paths:
  /healthz:
    get:
      tags: [system]
      operationId: health
      responses:
        '200':
          description: API process is alive
          headers: {X-Request-ID: {schema: {type: string}}}
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [status]
                    properties:
                      status: {const: ok}
        '405': {$ref: '#/components/responses/MethodNotAllowed'}
  /readyz:
    get:
      tags: [system]
      operationId: readiness
      responses:
        '200':
          description: Database and worker are healthy
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Readiness'
                  - properties: {data: {properties: {status: {const: ready}}}}
        '503':
          description: One or more dependencies are not ready
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Readiness'
                  - properties: {data: {properties: {status: {const: not_ready}}}}
        '405': {$ref: '#/components/responses/MethodNotAllowed'}
  /v1/providers:
    get:
      tags: [admin]
      operationId: listProviders
      summary: 模型 Provider 状态（不含密钥）
      responses:
        '200': {$ref: '#/components/responses/ProviderList'}
  /v1/imports:
    post:
      tags: [imports]
      operationId: createImport
      summary: 批量上传文件/文件夹并创建任务
      description: |
        multipart/form-data。**`paths` 字段必须最先出现且仅一次**，值为 JSON 数组，按顺序给出每个文件的相对路径（保留子目录，如 `财务/a.docx`）；
        随后按相同顺序重复 `files` 字段。每批最多 100 个文件、单文件 20 MiB、整批 128 MiB。
        格式不支持/空文件/过大文件作为失败项计入任务，不会让整批失败。可选 `Idempotency-Key`：相同键+相同内容返回同一任务，内容不同返回 409。
        可选查询参数 `template_id` 指定 OA 模板，否则按优先级自动匹配。
      parameters:
        - {name: template_id, in: query, schema: {type: string, format: uuid}}
        - {name: Idempotency-Key, in: header, schema: {type: string, maxLength: 128}}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [paths, files]
              properties:
                paths: {type: string, description: 'JSON 数组字符串，如 ["a/b.docx"]'}
                options: {type: string, description: 'JSON 字符串（ImportOptions：instruction/automation/llm_source/auto_ack），可选；若出现必须紧跟在 paths 之后、第一个 files 之前，且仅一次'}
                files: {type: array, items: {type: string, format: binary}}
      responses:
        '202': {$ref: '#/components/responses/Job'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /v1/tasks:
    get:
      tags: [imports]
      operationId: listTasks
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - {name: status, in: query, schema: {$ref: '#/components/schemas/TaskStatus'}}
      responses:
        '200':
          description: Task page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JobPageEnvelope'}
        '400': {$ref: '#/components/responses/Error'}
  /v1/tasks/{id}:
    get:
      tags: [imports]
      operationId: getTask
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses:
        '200': {$ref: '#/components/responses/Job'}
        '404': {$ref: '#/components/responses/Error'}
  /v1/tasks/{id}/events:
    get:
      tags: [imports]
      operationId: taskEvents
      summary: SSE 事件流
      description: |
        `text/event-stream`。每条事件 `id:` 为任务内单调递增整数，`data:` 为 AgentEvent JSON；支持 `Last-Event-ID` 续传（非法值 400）。
        心跳为注释行。事件只含脱敏摘要，不含文档正文、路径或提示词。
      parameters:
        - {$ref: '#/components/parameters/Id'}
        - {name: Last-Event-ID, in: header, schema: {type: integer, minimum: 0}}
      responses:
        '200':
          description: Event stream
          content:
            text/event-stream:
              schema: {type: string}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /v1/tasks/{id}/cancel:
    post:
      tags: [imports]
      operationId: cancelTask
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses:
        '200': {$ref: '#/components/responses/Job'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /v1/tasks/{id}/retry:
    post:
      tags: [imports]
      operationId: retryTask
      summary: 重试失败/已取消的任务（已归档文件保持不变）
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses:
        '200': {$ref: '#/components/responses/Job'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /v1/files:
    get:
      tags: [files]
      operationId: listFiles
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - {name: q, in: query, schema: {type: string}}
        - {name: department, in: query, schema: {type: string}}
        - {name: type, in: query, schema: {type: string}}
        - {name: date_from, in: query, schema: {type: string, format: date}}
        - {name: date_to, in: query, schema: {type: string, format: date}}
        - {name: archive_status, in: query, schema: {type: string, enum: [pending, archived, failed]}}
        - {name: review_required, in: query, schema: {type: boolean}}
        - {name: task_id, in: query, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: File page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FilePageEnvelope'}
        '400': {$ref: '#/components/responses/Error'}
  /v1/files/{id}:
    get:
      tags: [files]
      operationId: getFile
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses:
        '200':
          description: File record
          content:
            application/json:
              schema: {type: object, required: [data], properties: {data: {$ref: '#/components/schemas/FileRecord'}}}
        '404': {$ref: '#/components/responses/Error'}
  /v1/files/{id}/correction-proposals:
    post:
      tags: [files]
      operationId: proposeCorrection
      summary: 自然语言单文件纠错建议（只生成前后对比，不应用）
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [instruction]
              additionalProperties: false
              properties: {instruction: {type: string, minLength: 1, maxLength: 500}}
      responses:
        '201': {$ref: '#/components/responses/Correction'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /v1/correction-proposals/{id}/approve:
    post:
      tags: [files]
      operationId: approveCorrection
      summary: 确认并应用纠错；若文件在已批准计划中，计划退回待审批
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses:
        '200': {$ref: '#/components/responses/Correction'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /v1/archive-plans/{id}:
    get:
      tags: [plans]
      operationId: getPlan
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses:
        '200': {$ref: '#/components/responses/Plan'}
        '404': {$ref: '#/components/responses/Error'}
    patch:
      tags: [plans]
      operationId: patchPlan
      summary: 人工修订计划条目（乐观锁 version）
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, items]
              additionalProperties: false
              properties:
                version: {type: integer, minimum: 1}
                items: {type: array, minItems: 1, maxItems: 500, items: {$ref: '#/components/schemas/PlanPatch'}}
      responses:
        '200': {$ref: '#/components/responses/Plan'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /v1/archive-plans/{id}/approve:
    post:
      tags: [plans]
      operationId: approvePlan
      summary: 批准计划（仍有待人工确认条目时 409 REVIEW_REQUIRED）；不执行任何文件操作
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              additionalProperties: false
              properties: {version: {type: integer, minimum: 1}}
      responses:
        '200': {$ref: '#/components/responses/Plan'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /v1/archive-plans/{id}/execute:
    post:
      tags: [plans]
      operationId: executePlan
      summary: 执行已批准的计划（幂等）
      description: 必须带 Idempotency-Key。相同键重复请求返回同一结果；计划已执行时直接返回当前计划。原件只复制不移动，不覆盖已有文件，重名自动追加序号。
      parameters:
        - $ref: '#/components/parameters/Id'
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, maxLength: 128}}
      responses:
        '200': {$ref: '#/components/responses/Plan'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /v1/archive-operations/{id}/rollback:
    post:
      tags: [plans]
      operationId: rollbackOperation
      summary: 恢复一次归档操作（只删除本次发布且未被改动的文件）
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses:
        '200':
          description: Rolled back
          content:
            application/json:
              schema: {type: object, required: [data], properties: {data: {type: object, required: [status], properties: {status: {const: rolled_back}}}}}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /v1/ledger:
    get:
      tags: [ledger]
      operationId: listLedger
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - {name: q, in: query, description: 关键词（文件名/部门/类型/路径/日期，不区分大小写，`%` `_` 按字面匹配）, schema: {type: string}}
        - {name: department, in: query, schema: {type: string}}
        - {name: type, in: query, schema: {type: string}}
        - {name: date_from, in: query, schema: {type: string}}
        - {name: date_to, in: query, schema: {type: string}}
        - {name: sort, in: query, schema: {type: string, enum: [original_name, canonical_name, department, document_type, document_date, archive_path, executed_at]}}
        - {name: order, in: query, schema: {type: string, enum: [asc, desc]}}
        - {name: decision, in: query, description: 按决策方式筛选（manual=人工审批；ai_auto=全自动）, schema: {type: string, enum: [manual, ai_auto]}}
      responses:
        '200':
          description: Ledger page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LedgerPageEnvelope'}
  /v1/ledger/export:
    get:
      tags: [ledger]
      operationId: exportLedger
      summary: 导出 Excel（支持与 /v1/ledger 相同的筛选参数，不分页，最多 100000 行）
      parameters:
        - {name: q, in: query, schema: {type: string}}
        - {name: department, in: query, schema: {type: string}}
        - {name: type, in: query, schema: {type: string}}
        - {name: date_from, in: query, schema: {type: string}}
        - {name: date_to, in: query, schema: {type: string}}
        - {name: sort, in: query, schema: {type: string}}
        - {name: order, in: query, schema: {type: string, enum: [asc, desc]}}
        - {name: decision, in: query, description: 按决策方式筛选（manual=人工审批；ai_auto=全自动）, schema: {type: string, enum: [manual, ai_auto]}}
      responses:
        '200':
          description: xlsx 文件，工作表“归档台账”
          headers:
            Content-Disposition: {schema: {type: string}}
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: {type: string, format: binary}
  /v1/oa-templates:
    get:
      tags: [templates]
      operationId: listTemplates
      responses:
        '200':
          description: Templates ordered by priority
          content:
            application/json:
              schema: {type: object, required: [data], properties: {data: {type: array, items: {$ref: '#/components/schemas/OATemplate'}}}}
    post:
      tags: [templates]
      operationId: createTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TemplateInput'}
      responses:
        '201': {$ref: '#/components/responses/Template'}
        '400': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /v1/oa-templates/{id}:
    get:
      tags: [templates]
      operationId: getTemplate
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses:
        '200': {$ref: '#/components/responses/Template'}
        '404': {$ref: '#/components/responses/Error'}
    patch:
      tags: [templates]
      operationId: updateTemplate
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TemplateInput'}
      responses:
        '200': {$ref: '#/components/responses/Template'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
    delete:
      tags: [templates]
      operationId: deleteTemplate
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses:
        '204': {description: Deleted}
        '404': {$ref: '#/components/responses/Error'}
  /v1/oa-templates/{id}/test:
    post:
      tags: [templates]
      operationId: testTemplate
      summary: 用样本文件测试模板（不归档）
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties: {file: {type: string, format: binary}}
      responses:
        '200':
          description: Test result
          content:
            application/json:
              schema: {type: object, required: [data], properties: {data: {$ref: '#/components/schemas/TemplateTestResult'}}}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /v1/archive-rules:
    get:
      tags: [templates]
      operationId: listRules
      responses:
        '200':
          description: Rules
          content:
            application/json:
              schema: {type: object, required: [data], properties: {data: {type: array, items: {$ref: '#/components/schemas/ArchiveRule'}}}}
    post:
      tags: [templates]
      operationId: createRule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, naming_pattern, directory_pattern]
              additionalProperties: false
              properties:
                name: {type: string, minLength: 1, maxLength: 120}
                naming_pattern: {type: string, description: '占位符 {date}{year}{month}{day}{department}{type}{original}{stem}{ext}'}
                directory_pattern: {type: string}
                enabled: {type: boolean}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {type: object, required: [data], properties: {data: {$ref: '#/components/schemas/ArchiveRule'}}}
        '400': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /v1/audit-logs:
    get:
      tags: [admin]
      operationId: listAuditLogs
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Audit page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuditPageEnvelope'}
  /v1/fs:
    get:
      tags: [fs]
      operationId: listFolder
      summary: 浏览归档根目录下的文件夹
      description: |
        `path` 为相对归档根目录的路径（空 = 根）。只列出非隐藏项（以 `.` 开头的内部目录如 .staging/.journal/.trash 不可见）。
        台账管理的文件带 `ledger` 信息。目录在前、按名称排序。
      parameters:
        - {name: path, in: query, schema: {type: string, default: ''}}
      responses:
        '200':
          description: Folder listing
          content:
            application/json:
              schema: {type: object, required: [data], properties: {data: {$ref: '#/components/schemas/FolderListing'}}}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /v1/fs/content:
    get:
      tags: [fs]
      operationId: getFileContent
      summary: 预览或下载归档文件
      description: pdf/png/jpg 默认内联预览，其余及 `download=1` 作为附件下载；总是带 `nosniff` 并禁止缓存；除 pdf/png/jpg 外一律强制下载。
      parameters:
        - {name: path, in: query, required: true, schema: {type: string}}
        - {name: download, in: query, schema: {type: string, enum: ['1']}}
      responses:
        '200':
          description: File bytes (supports Range)
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /v1/fs/folders:
    post:
      tags: [fs]
      operationId: createFolder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              additionalProperties: false
              properties: {path: {type: string, description: 新文件夹的完整相对路径}}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {type: object, required: [data], properties: {data: {$ref: '#/components/schemas/FsEntry'}}}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /v1/fs/move:
    post:
      tags: [fs]
      operationId: moveEntry
      summary: 重命名或移动文件/文件夹（不覆盖；台账同步）
      description: |
        `to` 是目标的完整相对路径（重命名＝同目录换名，移动＝换目录）。目标已存在返回 409，不会覆盖；不能把文件夹移入自身。
        台账中受影响的记录（路径、规范文件名）同步更新。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, to]
              additionalProperties: false
              properties: {from: {type: string}, to: {type: string}}
      responses:
        '200':
          description: Moved
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [entry, ledger_updated]
                    properties:
                      entry: {$ref: '#/components/schemas/FsEntry'}
                      ledger_updated: {type: integer, minimum: 0}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /v1/fs/trash:
    get:
      tags: [fs]
      operationId: listTrash
      responses:
        '200':
          description: Items in the trash, newest first
          content:
            application/json:
              schema: {type: object, required: [data], properties: {data: {type: array, items: {$ref: '#/components/schemas/TrashItem'}}}}
    post:
      tags: [fs]
      operationId: trashEntry
      summary: 删除到回收站（可恢复；台账记录标记为已移除）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              additionalProperties: false
              properties: {path: {type: string}}
      responses:
        '201':
          description: Moved to trash
          content:
            application/json:
              schema: {type: object, required: [data], properties: {data: {$ref: '#/components/schemas/TrashItem'}}}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /v1/fs/trash/{id}/restore:
    post:
      tags: [fs]
      operationId: restoreTrash
      summary: 从回收站恢复到原位置（原位置被占用则自动加序号）
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses:
        '200':
          description: Restored
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [path, ledger_updated]
                    properties:
                      path: {type: string}
                      ledger_updated: {type: integer, minimum: 0}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /v1/fs/reveal:
    post:
      tags: [fs]
      operationId: revealInExplorer
      summary: 在 Windows 资源管理器中显示（仅本机、仅 Windows）
      description: |
        文件 → 打开其所在文件夹并选中；文件夹 → 打开该文件夹；空路径 → 归档根目录。
        只有当 API 运行在 Windows 上、请求来自本机回环地址且未被 `OA_ALLOW_REVEAL=0` 关闭时可用；否则 403（非本机）或 501（不支持）。
        路径必须位于归档根目录内；不会执行或打开文件本身。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties: {path: {type: string, default: ''}}
      responses:
        '200':
          description: Explorer was launched
          content:
            application/json:
              schema: {type: object, required: [data], properties: {data: {type: object, required: [revealed], properties: {revealed: {type: string}}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '501': {$ref: '#/components/responses/Error'}

  /v1/llm/presets:
    get:
      tags: [admin]
      operationId: listLlmPresets
      summary: 模型预设（DeepSeek、通义千问等）；用户仍可自由改 Base URL 与模型名
      responses:
        '200':
          description: Presets, recommended first
          content:
            application/json:
              schema: {type: object, required: [data], properties: {data: {type: array, items: {$ref: '#/components/schemas/LlmPreset'}}}}
  /v1/llm/config:
    get:
      tags: [admin]
      operationId: getLlmConfig
      summary: 当前识别引擎配置（API Key 永不返回，只返回是否已保存与尾号提示）
      responses:
        '200':
          description: Current configuration
          content:
            application/json:
              schema: {type: object, required: [data], properties: {data: {$ref: '#/components/schemas/LlmConfig'}}}
    put:
      tags: [admin]
      operationId: saveLlmConfig
      summary: 保存并立即生效（无需重启）
      description: |
        `mode=heuristic` 使用离线规则识别（不联网）。`mode=llm` 使用 OpenAI 兼容接口：`base_url` 必填且为 https（本机/内网地址允许 http），
        `model` 必填，需要密钥的预设必须已保存或随本次提交 `api_key`。`api_key` 省略 = 保持已保存的密钥；`clear_api_key=true` 清除。
        密钥在服务器端加密保存，不写入日志与审计。
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LlmConfigInput'}
      responses:
        '200':
          description: Saved and active
          content:
            application/json:
              schema: {type: object, required: [data], properties: {data: {$ref: '#/components/schemas/LlmConfig'}}}
        '400': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /v1/llm/test:
    post:
      tags: [admin]
      operationId: testLlm
      summary: 测试连接（用提交的参数发一次极小请求，不保存）
      description: 始终返回 200；`ok=false` 时 `message` 给出可读原因（密钥错误/模型不存在/网络不通…）。`tool_calling` 表示模型是否能发起工具调用（识别流程需要）。
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LlmTestInput'}
      responses:
        '200':
          description: Test outcome
          content:
            application/json:
              schema: {type: object, required: [data], properties: {data: {$ref: '#/components/schemas/LlmTestResult'}}}
        '400': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /v1/llm/models:
    post:
      tags: [admin]
      operationId: listLlmModels
      summary: 从服务商的 /models 接口获取可用模型列表（便于自由选择）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [base_url]
              additionalProperties: false
              properties:
                base_url: {type: string}
                api_key: {type: string, description: 省略则使用已保存的密钥}
      responses:
        '200':
          description: Model ids
          content:
            application/json:
              schema: {type: object, required: [data], properties: {data: {type: object, required: [models], properties: {models: {type: array, items: {type: string}}}}}}
        '400': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '502': {$ref: '#/components/responses/Error'}

  /v1/files/{id}/preview:
    get:
      tags: [files]
      operationId: previewFile
      summary: 预览导入时保存的原件（PDF/图片按页，Word/Excel 结构化）
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses:
        '200':
          description: Preview
          content:
            application/json:
              schema: {type: object, required: [data], properties: {data: {$ref: '#/components/schemas/Preview'}}}
        '404': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /v1/files/{id}/preview/page:
    get:
      tags: [files]
      operationId: previewFilePage
      summary: 原件第 N 页的 PNG 图片
      parameters:
        - {$ref: '#/components/parameters/Id'}
