# OA Agent server stack (enterprise edition). Normally driven by install.sh / oa-agentctl; settings come from ./.env.
# COMPOSE_FILE (in .env) selects the layers, ":"-separated, in this order:
#   docker-compose.yml                base (this file)
#   docker-compose.mounts.yml         GENERATED by "oa-agentctl mounts apply" from mounts.json (authoritative host paths)
#   docker-compose.https.yml          optional: Caddy with automatic HTTPS for OA_DOMAIN
#   docker-compose.build.yml          optional: build images from source (omit to use OA_IMAGE_REGISTRY images)
# The OA_*_DIR variables below are only fallbacks; the generated mounts override replaces the same container paths.
name: oa-agent

x-logging: &logging
  driver: json-file
  options:
    max-size: "${OA_LOG_MAX_SIZE:-10m}"
    max-file: "${OA_LOG_MAX_FILE:-5}"

x-hardening: &hardening
  restart: unless-stopped
  logging: *logging
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  read_only: true
  init: true

services:
  postgres:
    <<: *hardening
    image: ${OA_PG_IMAGE:-postgres:16-alpine}
    user: "70:70"   # data dir is chowned to 70:70 by install.sh / oa-agentctl restore
    environment:
      POSTGRES_DB: oa
      POSTGRES_USER: oa
      POSTGRES_PASSWORD: ${OA_POSTGRES_PASSWORD:?run install.sh (it generates .env)}
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: ${OA_TZ:-UTC}
    volumes:
      - ${OA_PG_DIR:-./data/pg}:/var/lib/postgresql/data
    tmpfs:
      - /tmp
      - /run/postgresql
    # No "ports": PostgreSQL is reachable only from the compose network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oa -d oa"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    deploy:
      resources:
        limits: {memory: "${OA_PG_MEM:-1g}"}

  api:
    <<: *hardening
    image: ${OA_IMAGE_REGISTRY:-oa-agent}/oa-agent-api:${OA_VERSION:-latest}
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      OA_LISTEN_ADDR: 0.0.0.0:8080
      OA_DATABASE_URL: postgres://oa:${OA_POSTGRES_PASSWORD}@postgres:5432/oa?sslmode=disable
      OA_AUTO_MIGRATE: "1"
      OA_MIGRATIONS_DIR: /app/migrations
      OA_FRONTEND_DIR: /app/web
      OA_WORKER_URL: http://127.0.0.1:8090     # worker shares this container's network namespace (loopback-only rule kept)
      OA_WORKER_TOKEN: ${OA_WORKER_TOKEN:?}
      OA_SPOOL_ROOT: /data/spool
      OA_ARCHIVE_ROOT: /data/archive
      OA_SECRET_KEY: ${OA_SECRET_KEY:?}
      OA_PUBLIC_URL: ${OA_PUBLIC_URL:-}
      OA_TRUSTED_PROXY: ${OA_TRUSTED_PROXY:-0}
      OA_ALLOW_REVEAL: "0"
      OA_STORAGE: ${OA_STORAGE:-on}
      OA_CORS_ORIGINS: ${OA_CORS_ORIGINS:-}
      OA_LLM_BASE_URL: ${OA_LLM_BASE_URL:-}
      OA_LLM_MODEL: ${OA_LLM_MODEL:-}
      OA_LLM_API_KEY: ${OA_LLM_API_KEY:-}
      OA_LLM_TIMEOUT_SECONDS: ${OA_LLM_TIMEOUT_SECONDS:-60}
      OA_LOG_LEVEL: ${OA_LOG_LEVEL:-}
      TZ: ${OA_TZ:-UTC}
    ports:
      # The ONLY published port. In https mode OA_BIND_ADDR=127.0.0.1 so only caddy (and local tools) reach it.
      - "${OA_BIND_ADDR:-0.0.0.0}:${OA_PORT:-8080}:8080"
    volumes:
      - ${OA_APP_DIR:-./data/app}:/data            # secret.key lives next to the spool dir: /data/secret.key
      - ${OA_SPOOL_DIR:-./data/spool}:/data/spool
      - ${OA_ARCHIVE_DIR:-./data/archive}:/data/archive
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits: {memory: "${OA_API_MEM:-1g}"}

  worker:
    <<: *hardening
    image: ${OA_IMAGE_REGISTRY:-oa-agent}/oa-agent-worker:${OA_VERSION:-latest}
    # Same network namespace as the API: the worker binds 127.0.0.1:8090 and the API refuses non-loopback worker URLs.
    # Nothing is published for the worker. After recreating/restarting api, recreate the worker too (oa-agentctl does).
    network_mode: "service:api"
    depends_on:
      api: {condition: service_healthy}
    environment:
      OA_WORKER_TOKEN: ${OA_WORKER_TOKEN:?}
      OA_WORKER_PORT: "8090"
      OA_SPOOL_ROOT: /data/spool
      OA_ALLOWED_ROOTS: /data/archive
      TZ: ${OA_TZ:-UTC}
    volumes:
      - ${OA_SPOOL_DIR:-./data/spool}:/data/spool
      - ${OA_ARCHIVE_DIR:-./data/archive}:/data/archive:ro
    tmpfs:
      - /tmp:size=512m
    deploy:
      resources:
        limits: {memory: "${OA_WORKER_MEM:-3g}"}
