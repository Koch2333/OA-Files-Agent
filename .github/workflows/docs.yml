name: Docs
# Disabled for now: runs only when started by hand (Actions -> Docs -> Run workflow). It failed on push because GitHub
# Pages is not enabled for the repository (Settings -> Pages -> Source: GitHub Actions). To re-enable automatic runs,
# restore the push / pull_request triggers (docs/** and this file) after enabling Pages.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install
        working-directory: docs
        run: npm ci
      - name: Build (fails on dead links)
        working-directory: docs
        env:
          DOCS_BASE: /${{ github.event.repository.name }}/
        run: npm run docs:build
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: docs/.vitepress/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
