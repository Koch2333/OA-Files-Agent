name: Backend, worker, contracts and frontend
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: oa, POSTGRES_PASSWORD: oa, POSTGRES_DB: oa_test}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U oa" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      OA_TEST_DATABASE_URL: postgres://oa:oa@127.0.0.1:5432/oa_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Go format, vet, test (includes real PostgreSQL integration tests), build
        working-directory: backend
        run: |
          test -z "$(gofmt -l cmd internal)"
          go vet ./...
          go test ./... -count=1
          go build ./...
      - name: Worker dependencies and tests
        working-directory: workers/document-ai
        run: |
          python -m pip install -r requirements.txt
          python -m unittest -v
      - name: Contract validation
        run: |
          python -m pip install -r scripts/requirements-contracts.txt
          python scripts/check_contracts.py
      - name: Go to Python worker connection
        working-directory: backend
        env:
          OA_TEST_PYTHON: python
        run: go test ./internal/worker -run TestPythonWorkerIntegration -v -count=1
      - name: Frontend typecheck, build, unit tests
        working-directory: frontend
        run: |
          npm ci
          npm run gen:api && git diff --exit-code src/api/schema.d.ts
          npm run build
          npm test
